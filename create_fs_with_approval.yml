---
# Create a filesystem after an interactive approval step.
# Auth: PUREFB_URL / PUREFB_API env vars.
- name: Create filesystem with approval
  hosts: localhost
  gather_facts: false
  vars:
    fs_name: everpure-webinar-demo-2
    fs_size: 1T
  tasks:
    - name: Request approval
      ansible.builtin.pause:
        prompt: "Approve creation of filesystem '{{ fs_name }}' ({{ fs_size }})? Type 'yes' to continue"
      register: approval

    - name: Abort if not approved
      ansible.builtin.assert:
        that: approval.user_input | trim | lower == 'yes'
        fail_msg: "Not approved - filesystem '{{ fs_name }}' was not created."
        success_msg: "Approved."

    - name: Create filesystem
      purestorage.flashblade.purefb_fs:
        name: "{{ fs_name }}"
        size: "{{ fs_size }}"
        nfsv3: true
        state: present
